; PlatformIO build for the rover firmware.
;
;   pio run                        compile the default (USB serial) link
;   pio run -t upload              compile and flash (board plugged in via USB)
;   pio device monitor             raw link traffic; binary in the serial env
;   pio run -e teensy41_can        compile the CAN link instead
;   pio run -e teensy41_can -t upload
;
; Two environments, one firmware. They differ only in ROVER_LINK_CAN, which
; selects the transport in firmware/rover_firmware.cpp. Everything above the
; transport -- framing, CRC, sequence numbers, the command watchdog, the drive
; stage -- is identical on both.
;
; teensy41 (default) carries the protocol over the Teensy's native USB serial
; port, which is how a laptop talks to the board with no extra hardware. The
; port is then a BINARY channel: there is no boot banner, because text mixed
; into framed binary is how a bring-up loses an afternoon. Proof of life is the
; pin 13 LED, which toggles once per telemetry period whether or not a host is
; listening.
;
; NOT YET BUILT BY PLATFORMIO ITSELF. Both environments have been cross-compiled
; and linked for the Teensy 4.1 by hand with arm-none-eabi-gcc against the real
; Teensy core and both libraries, but not with PlatformIO's toolchain or library
; revisions, and not in CI. See README.md "Known gaps".

[platformio]
; The firmware lives in firmware/, not the PlatformIO default src/. Everything
; under here is compiled recursively, which picks up firmware/src/*.cpp.
src_dir = firmware

; Without this, `pio run` would build BOTH environments and `pio run -t upload`
; would try to flash the board twice.
default_envs = teensy41

[env]
platform  = teensy
board     = teensy41
framework = arduino

; rover_firmware.cpp says #include "src/rover_controller.h", relative to
; itself. That resolves on its own for a .cpp compiled in place, but naming
; firmware/ as an include root keeps it working regardless of how the build
; directory is arranged.
build_flags = -I firmware

; Both libraries either transport needs. WDT_T4 is the hardware watchdog and is
; required in every environment; FlexCAN_T4 is only reached when
; ROVER_LINK_CAN=1, but is pinned here so switching environments needs no edit.
; Pinned to the upstream repos because neither is published in the PlatformIO
; registry under a name stable enough to depend on.
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git
    https://github.com/tonton81/WDT_T4.git

monitor_speed = 115200

[env:teensy41]
build_flags = ${env.build_flags} -D ROVER_LINK_CAN=0

[env:teensy41_can]
build_flags = ${env.build_flags} -D ROVER_LINK_CAN=1
