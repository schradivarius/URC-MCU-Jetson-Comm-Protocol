; PlatformIO build for the rover firmware.
;
; This is an ALTERNATIVE to the Arduino IDE + Teensyduino route in README.md,
; not a replacement: the sketch layout is unchanged, so either toolchain
; builds the same sources. Use whichever you have.
;
;   pio run                  compile for the Teensy 4.1
;   pio run -t upload        compile and flash (board plugged in via USB)
;   pio device monitor       the boot banner and diagnostics
;
; NOT YET COMPILED BY EITHER TOOLCHAIN. See README.md "What is not done".

[platformio]
; The sketch lives in firmware/, not the PlatformIO default src/. Everything
; under here is compiled recursively, which picks up firmware/src/*.cpp the
; same way the Arduino build does.
src_dir = firmware

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; rover_firmware.ino says #include "src/rover_controller.h", relative to
; itself. PlatformIO compiles a .ino from a generated file elsewhere, so make
; firmware/ an include root explicitly rather than relying on the default.
build_flags =
    -I firmware

; Same two libraries the Arduino route needs. Pinned to the upstream repos
; because neither is published in the PlatformIO registry under a name stable
; enough to depend on.
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git
    https://github.com/tonton81/WDT_T4.git

monitor_speed = 115200

; --- If the first compile fails on the generated prototypes ----------------
; PlatformIO injects forward declarations near the top of a converted .ino.
; readSensors() returns a struct declared half way down the file, so those
; declarations can land ahead of the type they name. If that is the error you
; get, compile the sketch as plain C++ instead -- no conversion, no injected
; prototypes -- by creating firmware/pio/main.cpp containing the single line
;
;     #include "../rover_firmware.ino"
;
; and uncommenting the filter below. Arduino only compiles the sketch root and
; src/ recursively, so firmware/pio/ stays invisible to the Arduino IDE and
; both toolchains keep working.
;
; build_src_filter = +<*> -<rover_firmware.ino>
